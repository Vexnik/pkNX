<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pkNX Web</title>
    <base href="/" />
    <style>
        :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
        body { margin: 0; padding: 1rem; line-height: 1.5; }
        main { max-width: 38rem; margin-inline: auto; }
        input[type=file] { font-size: 1rem; padding: 0.5rem 0; }
        input[type=search] { font-size: 1rem; width: 100%; padding: 0.5rem; box-sizing: border-box; margin-bottom: 0.5rem; }
        details { margin: 0.5rem 0; }
        summary { padding: 0.4rem 0; }
        .error { color: light-dark(#b3261e, #f2b8b5); }
    </style>
</head>
<body>
    <div id="app">Loading…</div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        window.downloadBase64File = (filename, base64, contentType) => {
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            const blob = new Blob([bytes], { type: contentType });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        };
    </script>
</body>
</html>
